{% set name = "django-colorfield" %}
{% set version = "0.14.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 478dbd3975a88f2ea2a9afc325faaca05c54ebf04ec985ce130f6dea39dfb899

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - django >=2.2
    - Pillow >=9.0.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - colorfield

about:
  home: https://github.com/fabiocaccamo/django-colorfield
  summary: django-colorfield, simple color field for your models with a nice color-picker in the admin-interface.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - swainn
    - gagelarsen
